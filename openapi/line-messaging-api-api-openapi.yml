  /v2/bot/coupon/{couponId}/close:
    put:
      externalDocs:
        url: https://developers.line.biz/en/reference/messaging-api/#discontinue-coupon
      tags:
      - messaging-api
      operationId: closeCoupon
      description: Close coupon
      parameters:
      - in: path
        name: couponId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Gone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/bot/chat/loading/start:
    post:
      externalDocs:
        url: https://developers.line.biz/en/reference/messaging-api/#display-a-loading-indicator
      tags:
      - messaging-api
      operationId: showLoadingAnimation
      description: Display a loading animation in one-on-one chats between users and LINE Official Accounts.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShowLoadingAnimationRequest'
        required: true
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowLoadingAnimationResponse'
        '400':
          description: An invalid chat ID is specified, or the loadingSeconds value is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/bot/chat/markAsRead:
    post:
      externalDocs:
        url: https://developers.line.biz/en/reference/messaging-api/#mark-as-read
      tags:
      - messaging-api
      operationId: markMessagesAsReadByToken
      description: Mark messages from users as read by token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkMessagesAsReadByTokenRequest'
            example:
              markAsReadToken: nz0x74mZT2mRn...
        required: true
      responses:
        '200':
          description: OK
        '400':
          description: An invalid markAsReadToken is specified. Tokens must be used by the bot that received them via Webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    RoomMemberCountResponse:
      externalDocs:
        url: https://developers.line.biz/en/reference/messaging-api/#get-members-room-count
      required:
      - count
      type: object
      properties:
        count:
          type: integer
          format: int32
          description: The count of members in the multi-person chat. The number returned excludes the LINE Official Account.
    SubscribedMembershipPlan:
      description: Object containing information about the membership plan.
      type: object
      required:
      - membershipId
      - title
      - description
      - benefits
      - price
      - currency
      properties:
        membershipId:
          type: integer
          description: Membership plan ID.
        title:
          type: string
          description: Membership plan name.
        description:
          type: string
          description: Membership plan description.
        benefits:
          type: array
          minItems: 1
          items:
            type: string
          description: List of membership plan perks.
        price:
          type: number
          format: double
          example: 500.0
          description: Monthly fee for membership plan. (e.g. 1500.00)
        currency:
          type: string
          description: The currency of membership.price.
          enum:
          - JPY
          - TWD
          - THB
    RoomUserProfileResponse:
      externalDocs:
        url: https://developers.line.biz/en/reference/messaging-api/#get-room-member-profile
      required:
      - displayName
      - userId
      type: object
      properties:
        displayName:
          type: string
          description: User's display name
        userId:
          type: string
          description: User ID
        pictureUrl:
          type: string
          format: uri
          description: Profile image URL. `https` image URL. Not included in the response if the user doesn't have a profile image.
    ValidateMessageRequest:
      required:
      - messages
      type: object
      properties:
        messages:
          maxItems: 5
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/Message'
          description: Array of message objects to validate
    MembersIdsResponse:
      required:
      - memberIds
      type: object
      properties:
        memberIds:
          type: array
          description: List of user IDs of members in the group chat. Only users of LINE for iOS and LINE for Android are included in `memberIds`.
          items:
            type: string
          maxItems: 100
        next:
          type: string
          description: 'A continuation token to get the next array of user IDs of the members in the group chat.

            Returned only when there are remaining user IDs that were not returned in `memberIds` in the original request.

            '
    CouponCreateRequest:
      description: Request object for creating a coupon. Contains all configurable coupon properties.
      required:
      - acquisitionCondition
      - endTimestamp
      - maxUseCountPerTicket
      - startTimestamp
      - title
      - visibility
      - timezone
      type: object
      properties:
        acquisitionCondition:
          $ref: '#/components/schemas/AcquisitionConditionRequest'
        barcodeImageUrl:
          type: string
          description: URL of the barcode image associated with the coupon. Used for in-store redemption.
        couponCode:
          type: string
          description: Unique code to be presented by the user to redeem the coupon. Optional.
        description:
          maxLength: 1000
          minLength: 0
          type: string
          description: Detailed description of the coupon. Displayed to users.
        endTimestamp:
          type: integer
          format: int64
          description: Coupon expiration time (epoch seconds). Coupon cannot be used after this time.
        imageUrl:
          type: string
          description: URL of the main image representing the coupon. Displayed in the coupon list.
        maxUseCountPerTicket:
          type: integer
          format: int32
          maximum: 1
          description: Maximum number of times a single coupon ticket can be used. Use -1 to indicate no limit.
        startTimestamp:
          type: integer
          format: int64
          description: Coupon start time (epoch seconds). Coupon can be used from this time.
        title:
          maxLength: 60
          minLength: 1
          type: string
          description: Title of the coupon. Displayed in the coupon list.
        usageCondition:
          maxLength: 100
          minLength: 0
          type: string
          description: Conditions for using the coupon. Shown to users.
        reward:
          $ref: '#/components/schemas/CouponRewardRequest'
        visibility:
          type: string
          description: Visibility of the coupon. Determines who can see or acquire the coupon.
          enum:
          - UNLISTED
          - PUBLIC
        timezone:
          type: string
          description: Timezone for interpreting start and end timestamps.
          enum:
          - ETC_GMT_MINUS_12
          - ETC_GMT_MINUS_11
          - PACIFIC_HONOLULU
          - AMERICA_ANCHORAGE
          - AMERICA_LOS_ANGELES
          - AMERICA_PHOENIX
          - AMERICA_CHICAGO
          - AMERICA_NEW_YORK
          - AMERICA_CARACAS
          - AMERICA_SANTIAGO
          - AMERICA_ST_JOHNS
          - AMERICA_SAO_PAULO
          - ETC_GMT_MINUS_2
          - ATLANTIC_CAPE_VERDE
          - EUROPE_LONDON
          - EUROPE_PARIS
          - EUROPE_ISTANBUL
          - EUROPE_MOSCOW
          - ASIA_TEHRAN
          - ASIA_TBILISI
          - ASIA_KABUL
          - ASIA_TASHKENT
          - ASIA_COLOMBO
          - ASIA_KATHMANDU
          - ASIA_ALMATY
          - ASIA_RANGOON
          - ASIA_BANGKOK
          - ASIA_TAIPEI
          - ASIA_TOKYO
          - AUSTRALIA_DARWIN
          - AUSTRALIA_SYDNEY
          - ASIA_VLADIVOSTOK
          - ETC_GMT_PLUS_12
          - PACIFIC_TONGATAPU
    Subscription:
      description: An array of memberships.
      required:
      - membership
      - user
      type: object
      properties:
        membership:
          $ref: '#/components/schemas/SubscribedMembershipPlan'
        user:
          $ref: '#/components/schemas/SubscribedMembershipUser'
    QuickReplyItem:
      externalDocs:
        url: https://developers.line.biz/en/reference/messaging-api/#items-object
      type: object
      properties:
        imageUrl:
          type: string
          format: uri
          description: URL of the icon that is displayed at the beginning of the button
          maxLength: 2000
        action:
          $ref: '#/components/schemas/Action'
        type:
          type: string
          description: '`action`'
          default: action
    ShowLoadingAnimationResponse:
      externalDocs:
        url: https://developers.line.biz/en/reference/messaging-api/#display-a-loading-indicator-response
      type: object
    QuickReply:
      externalDocs:
        url: https://developers.line.biz/en/reference/messaging-api/#items-object
      type: object
      description: Quick reply
      properties:
        items:
          type: array
          maxItems: 13
          items:
            $ref: '#/components/schemas/QuickReplyItem'
          description: Quick reply button objects.
    QuotaConsumptionResponse:
      externalDocs:
        url: https://developers.line.biz/en/reference/messaging-api/#get-consumption
      required:
      - totalUsage
      type: object
      properties:
        totalUsage:
          type: integer
          format: int64
          description: The number of sent messages in the current month
    MessagingApiPagerCouponListResponse:
      description: Paginated response object containing a list of coupons.
      required:
      - items
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CouponListResponse'
          description: List of coupon summary objects.
        next:
          type: string
          description: Token for fetching the next page of results.
    GroupSummaryResponse:
      externalDocs:
        url: https://developers.line.biz/en/reference/messaging-api/#get-group-summary
      required:
      - groupId
      - groupName
      type: object
      properties:
        groupId:
          type: string
          description: Group ID
        groupName:
          type: string
          description: Group name
        pictureUrl:
          type: string
          format: uri
          description: Group icon URL. Not included in the response if the user doesn't set a group profile icon.
    MulticastResponse:
      externalDocs:
        url: https://developers.line.biz/en/reference/messaging-api/#send-multicast-response
      type: object
    NarrowcastProgressResponse:
      externalDocs:
        url: https://developers.line.biz/en/reference/messaging-api/#get-narrowcast-progress-status
      required:
      - phase
      - acceptedTime
      type: object
      properties:
        phase:
          type: string
          enum:
          - waiting
          - sending
          - succeeded
          - failed
          description: 'The current status. One of:


            `waiting`: Messages are not yet ready to be sent. They are currently being filtered or processed in some way.

            `sending`: Messages are currently being sent.

            `succeeded`: Messages were sent successfully. This may not mean the messages were successfully received.

            `failed`: Messages failed to be sent. Use the failedDescription property to find the cause of the failure.

            '
        successCount:
          type: integer
          format: int64
          description: The number of users who successfully received the message.
        failureCount:
          type: integer
          format: int64
          description: The number of users who failed to send the message.
        targetCount:
          type: integer
          format: int64
          description: The number of intended recipients of the message.
        failedDescription:
          type: string
          description: The reason the message failed to be sent. This is only included with a `phase` property value of `failed`.
        errorCode:
          type: integer
          format: int64
          description: 'Error summary. This is only included with a phase property value of failed.

            One of:


            `1`: An internal error occurred.

            `2`: An error occurred because there weren''t enough recipients.

            `3`: A conflict error of requests occurs because a request that has already been accepted is retried.

            `4`: An audience of less than 50 recipients is included as a condition of sending.

            `5`: Message delivery has been canceled to prevent messages from being delivered only to a subset of the target audience.

            '
        acceptedTime:
          type: string
          format: date-time
          description: 'Narrowcast message request accepted time in milliseconds.


            Format: ISO 8601 (e.g. 2020-12-03T10:15:30.121Z)

            Timezone: UTC

            '
        completedTime:
          type: string
          format: date-time
          description: 'Processing of narrowcast message request completion time in milliseconds. Returned when the phase property is succeeded or failed.


            Format: ISO 8601 (e.g. 2020-12-03T10:15:30.121Z)

            Timezone: UTC

            '
    UserProfileResponse:
      externalDocs:
        url: https://developers.line.biz/en/reference/messaging-api/#get-profile
      required:
      - displayName
      - userId
      type: object
      properties:
        displayName:
          type: string
          description: User's display name
        userId:
          type: string
          description: User ID
        pictureUrl:
          type: string
          format: uri
          description: Profile image URL. `https` image URL. Not included in the response if the user doesn't have a profile image.
        statusMessage:
          type: string
          description: User's status message. Not included in the response if the user doesn't have a status message.
        language:
          type: string
          description: User's language, as a BCP 47 language tag. Not included in the response if the user hasn't yet consented to the LINE Privacy Policy.
          example: en
    CreateRichMenuAliasRequest:
      externalDocs:
        url: https://developers.line.biz/en/reference/messaging-api/#create-rich-menu-alias
      required:
      - richMenuAliasId
      - richMenuId
      type: object
      properties:
        richMenuAliasId:
          type: string
          description: Rich menu alias ID, which can be any ID, unique for each channel.
          maxLength: 32
          minLength: 1
          pattern: ^[a-z0-9_-]{1,32}$
        richMenuId:
          type: string
          description: The rich menu ID to be associated with the rich menu alias.
    ReplyMessageResponse:
      externalDocs:
        url: https://developers.line.biz/en/reference/messaging-api/#send-reply-message-response
      required:
      - sentMessages
      type: object
      properties:
        sentMessages:
          description: Array of sent messages.
          maxItems: 5
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/SentMessage'
    GetFollowersResponse:
      externalDocs:
        url: https://developers.line.biz/en/reference/messaging-api/#get-follower-ids
      required:
      - userIds
      type: object
      properties:
        userIds:
          type: array
          maxItems: 1000
          description: 'An array of strings indicating user IDs of users that have added the LINE Official Account as a friend.

            Only users of LINE for iOS and LINE for Android are included in `userIds`.

            '
          items:
            type: string
        next:
          type: string
          description: 'A continuation token to get the next array of user IDs.

            Returned only when there are remaining user IDs that weren''t returned in `userIds` in the original request.

            The number of user IDs in the `userIds` element doesn''t have to reach the maximum number specified by `limit` for the `next` property to be included in the response.


            '
    RichMenuBatchRequest:
      type: object
      required:
      - operations
      properties:
        operations:
          type: array
          items:
            $ref: '#/components/schemas/RichMenuBatchOperation'
          description: Array of Rich menu operation object...
          maxItems: 1000
        resumeRequestKey:
          type: string
          description: Key for retry. Key value is a string matching the regular expression pattern
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9_-]{1,100}$
    CouponListResponse:
      description: Summary information about a coupon, used in coupon lists.
      required:
      - couponId
      - title
      type: object
      properties:
        couponId:
          type: string
          description: Unique identifier of the coupon.
        title:
          type: string
          description: Title of the coupon. Displayed in the coupon list.
    BroadcastRequest:
      externalDocs:
        url: https://developers.line.biz/en/reference/messaging-api/#send-broadcast-message
      required:
      - messages
      type: object
      properties:
        messages:
          maxItems: 5
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/Message'
          description: List of Message objects.
        notificationDisabled:
          $ref: '#/components/schemas/NotificationDisabled'
    Membership:
      required:
      - membershipId
      - title
      - description
      - benefits
      - price
      - currency
      - memberCount
      - memberLimit
      - isInAppPurchase
      - isPublished
      type: object
      properties:
        membershipId:
          type: integer
          description: Membership plan ID.
        title:
          type: string
          description: Membership plan name.
        description:
          type: string
          description: Membership plan description.
        benefits:
          type: array
          minItems: 1
          items:
            type: string
          description: List of membership plan perks.
        price:
          type: number
          format: double
          example: 500.0
          description: Monthly fee for membership plan. (e.g. 1500.00)
        currency:
          type: string
          description: The currency of membership.price.
          enum:
          - JPY
          - TWD
          - THB
        memberCount:
          type: integer
          example: 100
          description: Number of members subscribed to the membership plan.
        memberLimit:
          type:
          - integer
          - 'null'
          example: 1000
          description: The upper limit of members who can subscribe. If no upper limit is set, it will be null.
        isInAppPurchase:
          type: boolean
          description: Payment method for users who subscribe to a membership plan.
        isPublished:
          type: boolean
          description: Membership plan status.
    RichMenuRequest:
      type: object
      properties:
        size:
          $ref: '#/components/schemas/RichMenuSize'
        selected:
          type: boolean
          description: '`true` to display the rich menu by default. Otherwise, `false`.'
        name:
          type: string
          description: Name of the rich menu. This value can be used to help manage your rich menus and is not displayed to users.
          maxLength: 300
        chatBarText:
          type: string
          description: Text displayed in the chat bar
          maxLength: 14
        areas:
          type: array
          description: Array of area objects which define the coordinates and size of tappable areas
          items:
            $ref: '#/components/schemas/RichMenuArea'
    QuotaType:
      externalDocs:
        url: https://developers.line.biz/en/reference/messaging-api/#get-quota
      type: string
      enum:
      - none
      - limited
      description: One of the following values to indicate whether a target limit is set or not.
    DemographicFilter:
      type: object
      description: Demographic filter
      properties:
        type:
          type: string
          description: Type of demographic filter
      discriminator:
        propertyName: type
        mapping:
          age: '#/components/schemas/AgeDemographicFilter'
          appType: '#/components/schemas/AppTypeDemographicFilter'
          area: '#/components/schemas/AreaDemographicFilter'
          gender: '#/components/schemas/GenderDemographicFilter'
          operator: '#/components/schemas/OperatorDemographicFilter'
          subscriptionPeriod: '#/components/schemas/SubscriptionPeriodDemographicFilter'
    Limit:
      externalDocs:
        url: https://developers.line.biz/en/reference/messaging-api/#send-narrowcast-message
      type: object
      description: Limit of the Narrowcast
      properties:
        max:
          minimum: 1
          type: integer
          format: int32
          description: 'The maximum number of narrowcast messages to send.

            Use this parameter to limit the number of narrowcast messages sent.

            The recipients will be chosen at random.

            '
        upToRemainingQuota:
          type: boolean
          default: false
          description: 'If true, the message will be sent within the maximum number of deliverable messages. The default value is `false`.


            Targets will be selected at random.

            '
        forbidPartialDelivery:
          type: boolean
          default: false
          description: 'This option prevents messages from being delivered to only a subset of the target audience.

            If true, the narrowcast request success but fails asynchronously.

            You can check whether message delivery was canceled by retrieving the narrowcast message progress.


            This property can be set to true only if upToRemainingQuota is set to true.

            '
    SentMessage:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          description: ID of the sent message.
        quoteToken:
          type: string
          description: 'Quote token of the message. Only included when a message object that can be specified as a quote target was sent as a push or reply message.

            '
    NarrowcastRequest:
      externalDocs:
        url: https://developers.line.biz/en/reference/messaging-api/#send-narrowcast-message
      required:
      - messages
      type: object
      properties:
        messages:
          maxItems: 5
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/Message'
          description: List of Message objects.
        recipient:
          $ref: '#/components/schemas/Recipient'
        filter:
          $ref: '#/components/schemas/Filter'
        limit:
          $ref: '#/components/schemas/Limit'
        notificationDisabled:
          $ref: '#/components/schemas/NotificationDisabled'
    RichMenuResponse:
      externalDocs:
        url: https://developers.line.biz/en/reference/messaging-api/#rich-menu-response-object
      required:
      - richMenuId
      - size
      - selected
      - name
      - chatBarText
      - areas
      type: object
      properties:
        richMenuId:
          type: string
          description: ID of a rich menu
        size:
          $ref: '#/components/schemas/RichMenuSize'
        selected:
          type: boolean
          description: '`true` to display the rich menu by default. Otherwise, `false`.'
        name:
          type: string
          description: Name of the rich menu. This value can be used to help manage your rich menus and is not displayed to users.
          maxLength: 300
        chatBarText:
          type: string
          description: Text displayed in the chat bar
          maxLength: 14
        areas:
          type: array
          items:
            $ref: '#/components/schemas/RichMenuArea'
          description: Array of area objects which define the coordinates and size of tappable areas
          maxItems: 20
    ShowLoadingAnimationRequest:
      externalDocs:
        url: https://developers.line.biz/en/reference/messaging-api/#display-a-loading-indicator-request-body
      required:
      - chatId
      type: object
      properties:
        chatId:
          type: string
          description: User ID of the target user for whom the loading animation is to be displayed.
        loadingSeconds:
          type: integer
          format: int32
          maximum: 60
          minimum: 5
          description: 'The number of seconds to display the loading indicator.

            It must be a multiple of 5. The maximum value is 60 seconds.

            '
    RichMenuBatchOperation:
      description: Rich menu operation object represents the batch operation to the rich menu linked to the user.
      externalDocs:
        url: https://developers.line.biz/en/reference/messaging-api/#batch-control-rich-menus-of-users-operations
      required:
      - type
      type: object
      properties:
        type:
          type: string
          description: The type of operation to the rich menu linked to the user. One of link, unlink, or unlinkAll.
      discriminator:
        propertyName: type
        mapping:
          link: '#/components/schemas/RichMenuBatchLinkOperation'
          unlink: '#/components/schemas/RichMenuBatchUnlinkOperation'
          unlinkAll: '#/components/schemas/RichMenuBatchUnlinkAllOperation'
    BroadcastResponse:
      externalDocs:
        url: https://developers.line.biz/en/reference/messaging-api/#send-broadcast-response
      type: object
    RichMenuSize:
      type: object
      description: Rich menu size
      properties:
        width:
          maximum: 2147483647
          minimum: 1
          type: integer
          format: int64
          description: width
        height:
          maximum: 2147483647
          minimum: 1
          type: integer
          format: int64
          description: height
    NumberOfMessagesResponse:
      required:
      - status
      type: object
      properties:
        status:
          type: string
          enum:
          - ready
          - unready
          - unavailable_for_privacy
          - out_of_service
          description: 'Aggregation process status. One of:


            `ready`: The number of messages can be obtained.

            `unready`: We haven''t finished calculating the number of sent messages for the specified in date. For example, this property is returned when the delivery date or a future date is specified. Calculation usually takes about a day.

            `unavailable_for_privacy`: The total number of messages on the specified day is less than 20.

            `out_of_service`: The specified date is earlier than the date on which we first started calculating sent messages (March 31, 2018).

            '
        success:
          type: integer
          format: int64
          description: 'The number of messages delivered using the phone number on the date specified in `date`.

            The response has this property only when the value of `status` is `ready`.


            '
    GroupMemberCountResponse:
      externalDocs:
        url: https://developers.line.biz/en/reference/messaging-api/#get-members-group-count
      required:
      - count
      type: object
      properties:
        count:
          type: integer
          format: int32
          description: The count of members in the group chat. The number returned excludes the LINE Official Account.
    SetWebhookEndpointRequest:
      externalDocs:
        url: https://developers.line.biz/en/reference/messaging-api/#set-webhook-endpoint-url
      required:
      - endpoint
      type: object
      properties:
        endpoint:
          maxLength: 500
          minLength: 0
          type: string
          format: uri
          description: A valid webhook URL.
    TestWebhookEndpointResponse:
      externalDocs:
        url: https://developers.line.biz/en/reference/messaging-api/#test-webhook-endpoint
      required:
      - statusCode
      - timestamp
      - reason
      - detail
      type: object
      properties:
        success:
          type: boolean
          description: Result of the communication from the LINE platform to the webhook URL.
        timestamp:
