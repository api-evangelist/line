    url: https://developers.line.biz/en/reference/messaging-api/#get-insight
- aid: line:line-manage-audience-api
  name: LINE Manage Audience API
  description: >-
    Twelve operations for building and managing the marketing audiences a
    narrowcast targets — creating audiences from uploaded user IDs by JSON or
    by file, click-based and impression-based audiences derived from earlier
    sends, renaming, deleting, and reading audience data and shared Business
    Manager audiences. Uploads are asynchronous jobs limited to ten concurrent
    operations per audience.
  humanURL: https://developers.line.biz/en/reference/messaging-api/#manage-audience-group
  baseURL: https://api.line.me
  tags:
  - Marketing
  - Audience
  properties:
  - type: OpenAPI
    url: openapi/line-manage-audience-openapi.yml
  - type: Overlay
    url: overlays/line-manage-audience-overlay.yaml
  - type: APIReference
    url: https://developers.line.biz/en/reference/messaging-api/#manage-audience-group
  note: >-
    The by-file variants (createAudienceForUploadingUserIds,
    addUserIdsToAudience) must be sent to https://api-data.line.me, not
    api.line.me.
- aid: line:line-liff-api
  name: LIFF Server API
  description: >-
    Four operations for managing LINE Front-end Framework apps on a LINE Login
    channel — add, list, update and delete LIFF apps. LIFF apps are web
    applications that run inside the LINE client's in-app browser and can read
    the logged-in user's profile, obtain an ID token, send messages into the
    current chat and open the scanner.
  humanURL: https://developers.line.biz/en/reference/liff-server/
  baseURL: https://api.line.me
  tags:
  - Mini Apps
  - LIFF
