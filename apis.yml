- aid: line:line-webhook
  name: LINE Messaging API Webhook
  description: >-
    The inbound event surface of the Messaging API, published by LINE as an
    OpenAPI type-definition document. LINE delivers CallbackRequest envelopes
    to the bot server's configured HTTPS endpoint, carrying an events[] array
    of 20+ polymorphic event types (message, follow, unfollow, join, leave,
    postback, beacon, accountLink, membership, videoPlayComplete and others)
    over 60 component schemas. Every delivery is signed with a Base64
    HMAC-SHA256 of the raw body in the x-line-signature header.
  humanURL: https://developers.line.biz/en/reference/messaging-api/#webhooks
  baseURL: https://api.line.me
  tags:
  - Webhook
  - Event
  tags_raw:
  - Webhooks
  - Events
  properties:
  - type: OpenAPI
    url: openapi/line-webhook-openapi.yml
  - type: AsyncAPI
    url: asyncapi/line-messaging-webhook.yml
  - type: Overlay
    url: overlays/line-webhook-overlay.yaml
  - type: Documentation
    url: https://developers.line.biz/en/docs/messaging-api/receiving-messages/
  - type: Spectral
    url: rules/line-asyncapi-spectral-rules.yml
  note: >-
    baseURL records the platform host that originates the delivery. The
    published spec declares servers[] as https://example.com because the
    receiving endpoint is owned by the bot developer, not by LINE.
- aid: line:line-channel-access-token-api
  name: LINE Channel Access Token API
  description: >-
    Issues, verifies and revokes the channel access tokens every other LINE
    server API consumes. Four generations run concurrently: long-lived tokens
    from the Developers Console, v2.0 short-lived tokens, v2.1 JWT-assertion
    tokens that support concurrent validity and zero-downtime rotation, and v3
    stateless 15-minute tokens. Eight operations.
  humanURL: https://developers.line.biz/en/docs/basics/channel-access-token/
  baseURL: https://api.line.me
  tags:
  - Authentication
  - Tokens
  properties:
  - type: OpenAPI
    url: openapi/line-channel-access-token-openapi.yml
  - type: Overlay
