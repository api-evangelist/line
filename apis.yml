apis:
- aid: line:line-messaging-api
  name: LINE Messaging API
  description: >-
    The core LINE bot API — 73 operations for replying, pushing, multicasting,
    broadcasting and narrowcasting messages to LINE users, plus rich menus,
    Flex messages, group and room membership, profiles, followers, message
    quota, delivery statistics, coupons, memberships and webhook endpoint
    configuration. Supports idempotent retries via the X-Line-Retry-Key header
    on the four metered send operations. Binary content (message media, rich
    menu images) is served from api-data.line.me rather than api.line.me.
  humanURL: https://developers.line.biz/en/docs/messaging-api/
  baseURL: https://api.line.me
  tags:
  - Messaging
  - Chatbots
  - Rich Menu
  - Webhook
  tags_raw:
