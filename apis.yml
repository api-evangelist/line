aid: line
name: LINE
description: >-
  LINE is a Japan-based messaging platform operated by LY Corporation, with
  over 200 million monthly active users across Japan, Taiwan, Thailand and
  Indonesia, offering messaging, payments, news and a broad ecosystem of
  services. The LINE Developers platform exposes public APIs for building
  chatbots and Official Accounts (Messaging API), issuing and rotating
  credentials (Channel Access Token API), reading delivery and audience
  analytics (Insight API), building marketing audiences (Manage Audience API),
  running web apps inside the LINE client (LIFF), and social login via LINE
  Login v2.1 over OAuth 2.0 and OpenID Connect. LINE publishes nine
  first-party OpenAPI documents covering 111 operations at
  github.com/line/line-openapi and generates all six official server SDKs from
  them. Server API calls authenticate with a channel access token presented as
  an HTTP Bearer credential and scoped to a single LINE channel.
type: Index
