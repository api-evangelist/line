  - type: Documentation
    url: https://developers.line.biz/en/docs/basics/channel-access-token/
  - type: Authentication
    url: authentication/line-authentication.yml
- aid: line:line-insight-api
  name: LINE Insight API
  description: >-
    Seven read operations returning analytics for a LINE Official Account —
    friend demographics, number of followers, number of message deliveries by
    day, per-request message event statistics (impressions, clicks, per-link
    breakdown), statistics per aggregation unit, and rich menu insight totals
    and daily series.
  humanURL: https://developers.line.biz/en/reference/messaging-api/#get-insight
  baseURL: https://api.line.me
  tags:
  - Analytics
  - Insight
