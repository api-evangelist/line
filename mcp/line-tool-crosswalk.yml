description: >-
  Binds each tool exposed by the first-party LINE Bot MCP Server to the LINE
  Messaging API operation(s) that back it. Every operationId below was verified
  present in the harvested OpenAPI. Because the MCP server is stdio-only there
  is no live endpoint to introspect, so the binding is by name and documented
  semantics rather than by observed inputSchema — confidence is recorded
  accordingly.
surfaces:
  openapi:
    path: openapi/line-messaging-api-openapi.yml
    operations: 73
    gated: false
    servers:
      - https://api.line.me
  mcp:
    transport: stdio
    endpoint: null
    package: "@line/line-bot-mcp-server"
    tools: 12
    gated: true
    note: >-
      Local-stdio only — no URL an MCP client can POST tools/list to. Live
      inputSchema introspection would require installing and running the server
      with a channel access token.
  graphql:
    endpoint: null
    note: LINE publishes no GraphQL surface.
crosswalk:
  - tool: push_text_message
    category: messaging
    rest: [pushMessage]
    binding: POST /v2/bot/message/push with a single text message object
    confidence: high
    note: >-
      The REST operation accepts the X-Line-Retry-Key idempotency header and an
      array of up to 5 message objects; the tool narrows this to one text
      message and does not expose the retry key.
  - tool: push_flex_message
    category: messaging
    rest: [pushMessage]
    binding: POST /v2/bot/message/push with a single flex message object
    confidence: high
  - tool: broadcast_text_message
    category: messaging
    rest: [broadcast]
    binding: POST /v2/bot/message/broadcast with a single text message object
    confidence: high
  - tool: broadcast_flex_message
    category: messaging
    rest: [broadcast]
    binding: POST /v2/bot/message/broadcast with a single flex message object
    confidence: high
  - tool: get_profile
    category: identity
    rest: [getProfile]
    binding: GET /v2/bot/profile/{userId}
    confidence: high
  - tool: get_message_quota
    category: quota
    rest: [getMessageQuota, getMessageQuotaConsumption]
    binding: >-
      GET /v2/bot/message/quota plus GET /v2/bot/message/quota/consumption —
      the tool returns both the limit and current usage, which are two separate
      REST operations.
    confidence: high
  - tool: get_rich_menu_list
    category: rich-menu
    rest: [getRichMenuList]
    binding: GET /v2/bot/richmenu/list
    confidence: high
  - tool: delete_rich_menu
    category: rich-menu
    rest: [deleteRichMenu]
    binding: DELETE /v2/bot/richmenu/{richMenuId}
    confidence: high
  - tool: set_rich_menu_default
    category: rich-menu
    rest: [setDefaultRichMenu]
    binding: POST /v2/bot/user/all/richmenu/{richMenuId}
    confidence: high
  - tool: cancel_rich_menu_default
    category: rich-menu
    rest: [cancelDefaultRichMenu]
    binding: DELETE /v2/bot/user/all/richmenu
    confidence: high
  - tool: create_rich_menu
    category: rich-menu
    rest: [createRichMenu, setRichMenuImage, setDefaultRichMenu]
    binding: >-
      Composite. POST /v2/bot/richmenu to create the menu, POST
      /v2/bot/richmenu/{richMenuId}/content (api-data.line.me) to upload the
      generated image, then POST /v2/bot/user/all/richmenu/{richMenuId} to set
      it as default — the README describes all three steps as one tool call.
    confidence: medium
    note: The image is generated by the server, not supplied by the caller.
  - tool: get_follower_ids
    category: audience
    rest: [getFollowers]
    binding: GET /v2/bot/followers/ids with start/limit continuation paging
    confidence: high
