description: >-
  LINE publishes no single platform-wide API changelog. Change is announced
  across three surfaces: the LINE Developers news feed (all platform APIs, not
  version-tagged), per-SDK release notes pages, and GitHub releases on the
  first-party SDK repositories. The LIFF release notes are the only dated,
  versioned, machine-readable changelog LINE maintains on the developer site,
  so they are the structured record captured here.
